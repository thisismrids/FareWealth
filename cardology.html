<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cardology by FareWealth</title>
<link rel="icon" type="image/png" sizes="192x192" href="https://api.farewealth.in/assets/cardology_icon.png">
<link rel="apple-touch-icon" href="https://api.farewealth.in/assets/cardology_apple_icon.png">
<meta name="description" content="Find the credit cards that give you the most on your spends. A one-minute chat, built on real card data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f5f7; --surface: #ffffff; --ink: #222831; --muted: #6b7079; --line: #e3e5e9;
  --brand: #37414f; --brand-ink: #ffffff; --accent: #b8913f; --chip: #eef0f3; --chip-on: #37414f;
  --user: #37414f; --user-ink: #ffffff; --shadow: 0 1px 2px rgba(20, 24, 31, .06), 0 4px 16px rgba(20, 24, 31, .05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181d; --surface: #1d2128; --ink: #eceef1; --muted: #9aa0a9; --line: #2c313a;
    --brand: #c9ced6; --brand-ink: #15181d; --accent: #d8b46a; --chip: #262b33; --chip-on: #c9ced6;
    --user: #3b4555; --user-ink: #ffffff; --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  }
}
:root[data-theme="dark"] {
  --bg: #15181d; --surface: #1d2128; --ink: #eceef1; --muted: #9aa0a9; --line: #2c313a;
  --brand: #c9ced6; --brand-ink: #15181d; --accent: #d8b46a; --chip: #262b33; --chip-on: #c9ced6;
  --user: #3b4555; --user-ink: #ffffff; --shadow: 0 1px 2px rgba(0, 0, 0, .3);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15.5px/1.55 "Noto Sans JP", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; }
.app { display: flex; flex-direction: column; height: 100dvh; max-width: 760px; margin: 0 auto; }
header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line);
  background: var(--bg); position: sticky; top: 0; z-index: 2; }
header img { height: 38px; width: auto; }
header h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .2px; }
header p { margin: 0; font-size: 12.5px; color: var(--muted); }
header a.tg { margin-left: auto; font-size: 12.5px; color: var(--muted); text-decoration: none; border: 1px solid var(--line);
  padding: 6px 10px; border-radius: 999px; white-space: nowrap; }
header a.tg:hover { color: var(--ink); }
#log { flex: 1; overflow-y: auto; padding: 18px 16px 8px; scroll-behavior: smooth; }
.row { display: flex; margin: 0 0 10px; }
.row.user { justify-content: flex-end; }
.bubble { max-width: 86%; padding: 11px 14px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow);
  white-space: pre-line; overflow-wrap: anywhere; border-top-left-radius: 6px; }
.row.user .bubble { background: var(--user); color: var(--user-ink); border-radius: 16px; border-top-right-radius: 6px;
  box-shadow: none; }
.bubble b { font-weight: 700; }
.bubble i { color: var(--muted); }
.row.user .bubble i { color: inherit; }
.bubble a { color: var(--accent); }
.card { max-width: 92%; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden;
  border-top-left-radius: 6px; }
.card img { display: block; width: 100%; max-width: 420px; margin: 6px auto 0; padding: 0 6px; }
.card .cap { padding: 8px 16px 6px; white-space: pre-line; }
.card .cap i { color: var(--muted); }
.card .apply { display: block; margin: 4px 14px 14px; text-align: center; padding: 10px; border-radius: 12px;
  background: var(--brand); color: var(--brand-ink); text-decoration: none; font-weight: 700; font-size: 14.5px; }
.card .apply:hover { filter: brightness(1.08); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 14px; }
.qcard { max-width: 92%; background: var(--surface); border-radius: 16px; border-top-left-radius: 6px;
  box-shadow: var(--shadow); padding: 14px 16px; border-left: 3px solid var(--accent); }
.qcard .qtext { font-weight: 700; font-size: 16px; line-height: 1.45; white-space: pre-line; overflow-wrap: anywhere; }
.qcard .qtext i { font-weight: 400; color: var(--muted); font-size: 14px; }
.qcard .hint { margin-top: 4px; font-size: 12.5px; color: var(--muted); }
.qcard .opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.qcard .opt { font: inherit; font-size: 14px; font-weight: 500; border: 1px solid var(--line); background: var(--chip);
  color: var(--ink); padding: 9px 14px; border-radius: 10px; cursor: pointer; text-align: left;
  transition: background .15s, border-color .15s, color .15s; }
.qcard .opt:hover { border-color: var(--brand); background: var(--surface); }
.qcard .opt.on, .qcard .opt.on:hover { background: var(--chip-on); color: var(--brand-ink); border-color: var(--chip-on); }
.qcard .opt.on::before { content: "✓ "; }
.qcard .opt.done, .qcard .opt.done:hover { background: var(--accent); color: #15181d; border-color: var(--accent); font-weight: 700; }
.qcard .opt[disabled] { opacity: .45; cursor: default; }
.qcard .qfoot { display: flex; gap: 14px; margin-top: 10px; }
.qcard .link { font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; padding: 2px 0; cursor: pointer; }
.qcard .link:hover { color: var(--ink); text-decoration: underline; }
.qcard.answered { padding: 11px 14px; }
.qcard.answered .qtext { font-weight: 500; font-size: 15px; }
.chip { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 8px 14px; border-radius: 999px; cursor: pointer; transition: background .15s, border-color .15s; }
.chip:hover { border-color: var(--brand); }
.chip.on { background: var(--chip-on); color: var(--brand-ink); border-color: var(--chip-on); }
.chip.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 700; }
.chip.ghost { background: transparent; color: var(--muted); }
.chip[disabled] { opacity: .45; cursor: default; }
.typing { display: inline-flex; gap: 4px; align-items: center; padding: 14px 16px; }
.typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
.typing em { margin-left: 8px; font-style: normal; font-size: 13px; color: var(--muted); }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
form { display: flex; gap: 8px; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line);
  background: var(--bg); }
form[hidden] { display: none; }
form input { flex: 1; min-width: 0; font: inherit; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); outline: none; }
form input:focus { border-color: var(--brand); }
form button { font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 0 16px; background: var(--brand);
  color: var(--brand-ink); cursor: pointer; }
footer { text-align: center; font-size: 11.5px; color: var(--muted); padding: 0 16px 10px; }
@media (max-width: 520px) { body { font-size: 15px; } .bubble, .card { max-width: 96%; } header a.tg span { display: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <img id="logo" alt="FareWealth">
    <div><h1>Cardology</h1><p>Find the cards that pay you the most</p></div>
    <a class="tg" href="https://t.me/cardology_bot" target="_blank" rel="noopener">✈︎ <span>Also on </span>Telegram</a>
  </header>
  <main id="log" aria-live="polite"></main>
  <form id="bar" hidden autocomplete="off">
    <input id="inp" type="text" placeholder="Type here…" maxlength="500" aria-label="Message">
    <button type="submit" aria-label="Send">Send</button>
  </form>
  <footer>Cardology™ · AamM Enterprises LLP</footer>
</div>
<script>
const host = location.hostname;
const API = (host.endsWith("farewealth.in") && host !== "api.farewealth.in") ? "https://api.farewealth.in" : "";
const log = document.getElementById("log"), bar = document.getElementById("bar"), inp = document.getElementById("inp");
document.getElementById("logo").src = API + "/assets/farewealth_logo.png";
let sid = null, state = { prompt: null, input: { mode: "none" } }, busy = false;
try { sid = localStorage.getItem("cardology_sid"); } catch (e) {}

function scroll() { requestAnimationFrame(() => { log.scrollTop = log.scrollHeight; }); }
function el(tag, cls, html) { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; }
function clearChips() {
  log.querySelectorAll(".chips.live").forEach(c => c.remove());
  log.querySelectorAll(".qcard.live").forEach(q => {          // answered: keep just the question
    q.querySelectorAll(".opts, .qfoot, .hint").forEach(x => x.remove()); q.classList.remove("live"); q.classList.add("answered");
  });
}

function addBot(html) { const r = el("div", "row"); r.appendChild(el("div", "bubble", html)); log.appendChild(r); }
function addPlain(text) { const r = el("div", "row"); const b = el("div", "bubble"); b.textContent = text; r.appendChild(b); log.appendChild(r); }
function addUser(text) { const r = el("div", "row user"); const b = el("div", "bubble"); b.textContent = text; r.appendChild(b); log.appendChild(r); scroll(); }
function addCard(m) {
  const r = el("div", "row"), c = el("div", "card");
  const img = el("img"); img.src = API + m.image; img.alt = ""; img.loading = "lazy"; c.appendChild(img);
  c.appendChild(el("div", "cap", m.html));
  if (m.apply) { const a = el("a", "apply", "Apply ↗"); a.href = m.apply; a.target = "_blank"; a.rel = "noopener"; c.appendChild(a); }
  r.appendChild(c); log.appendChild(r);
}
function typing(label) {
  const r = el("div", "row typing-row"), b = el("div", "bubble typing", "<span></span><span></span><span></span>");
  if (label) b.appendChild(el("em", null, label));
  r.appendChild(b); log.appendChild(r); scroll(); return r;
}

async function send(body, echo, waitLabel) {
  if (busy) return; busy = true; clearChips(); if (echo) addUser(echo);
  bar.hidden = true;
  const t = typing(waitLabel);
  try {
    const res = await fetch(API + "/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ sid }, body)) });
    const data = await res.json();
    t.remove();
    if (data.error) { addPlain(data.error); busy = false; showInput(state.input); return; }
    sid = data.sid; try { localStorage.setItem("cardology_sid", sid); } catch (e) {}
    render(data);
  } catch (e) {
    t.remove(); addPlain("Couldn't reach Cardology just now. Check your connection and try again.");
    const c = el("div", "chips live"); const b = el("button", "chip primary", "Try again");
    b.onclick = () => { busy = false; send(body, null, waitLabel); }; c.appendChild(b); log.appendChild(c);
  }
  busy = false; scroll();
}

function render(d) {
  (d.messages || []).forEach(m => m.kind === "card" ? addCard(m) : m.kind === "plain" ? addPlain(m.text) : addBot(m.html));
  state.prompt = d.prompt; state.input = d.input || { mode: "none" };
  if (d.prompt) renderPrompt(d.prompt);
  if (d.actions && d.actions.length) {
    const c = el("div", "chips live");
    d.actions.forEach(a => {
      if (a.url) { const l = el("a", "chip", a.label); l.href = a.url; l.target = "_blank"; l.rel = "noopener";
        l.style.textDecoration = "none"; c.appendChild(l); return; }
      const b = el("button", "chip" + (a.action === "book_ok" ? " primary" : ""), a.label);
      b.onclick = () => send({ action: a.action, value: a.value }, a.label.replace(/^[^\w₹]+/u, "").trim() || a.label,
        a.action === "book" ? "Checking the calendar…" : null);
      c.appendChild(b);
    });
    log.appendChild(c);
  }
  showInput(state.input);
  scroll();
}

function renderPrompt(p) {
  const row = el("div", "row"), card = el("div", "qcard live");
  card.appendChild(el("div", "qtext", p.html));
  if (p.kind === "multi") card.appendChild(el("div", "hint", /pick/i.test(p.html) ? "Then tap Done." : "Pick all that apply, then tap Done."));
  const opts = el("div", "opts"), foot = el("div", "qfoot");
  if (p.kind === "single") {
    p.options.forEach((label, i) => { const b = el("button", "opt", label);
      b.onclick = () => send({ action: "answer", qid: p.qid, index: i }, label, lastQuestion(p) ? "Crunching the numbers…" : null);
      opts.appendChild(b); });
  } else if (p.kind === "multi") {
    const picked = [];
    const done = el("button", "opt done", "Done →"); done.disabled = true;
    p.options.forEach((label, i) => { const b = el("button", "opt", label);
      b.onclick = () => {
        const k = picked.indexOf(i);
        if (k >= 0) { picked.splice(k, 1); b.classList.remove("on"); }
        else { if (p.max && picked.length >= p.max) return; picked.push(i); b.classList.add("on"); }
        done.disabled = !picked.length;
      };
      opts.appendChild(b); });
    done.onclick = () => send({ action: "answer", qid: p.qid, indices: picked }, picked.map(i => p.options[i]).join(", "));
    opts.appendChild(done);
  } else if (p.kind === "text" && p.skip_label) {
    const b = el("button", "link", p.skip_label + " →");
    b.onclick = () => send({ action: "answer", qid: p.qid, skip: true }, p.skip_label, lastQuestion(p) ? "Crunching the numbers…" : null);
    foot.appendChild(b);
  }
  if (opts.children.length) card.appendChild(opts);
  if (p.can_back) { const b = el("button", "link", "← Back"); b.onclick = () => send({ action: "back" }); foot.appendChild(b); }
  if (foot.children.length) card.appendChild(foot);
  row.appendChild(card); log.appendChild(row);
}
function lastQuestion(p) { return p.qid === "notes"; }

function showInput(i) {
  const on = i && i.mode && i.mode !== "none";
  bar.hidden = !on;
  if (on) { inp.type = i.mode === "email" ? "email" : "text"; inp.placeholder = i.placeholder || "Type here…";
    if (matchMedia("(pointer: fine)").matches) inp.focus(); }
}

bar.addEventListener("submit", e => {
  e.preventDefault(); const text = inp.value.trim(); if (!text || busy) return; inp.value = "";
  const p = state.prompt;
  if (p && p.kind === "text") send({ action: "answer", qid: p.qid, text }, text,
    p.qid === "existing_cards" ? "Reading your cards…" : lastQuestion(p) ? "Crunching the numbers…" : null);
  else send({ action: "text", text }, text, state.input.mode === "followup" ? "Thinking…" : null);
});

send({ action: "start" });
</script>
</body>
</html>
